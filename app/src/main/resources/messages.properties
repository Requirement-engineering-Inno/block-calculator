tour.welcome.title=Welcome to Block Calculator
tour.welcome.text=Here you turn the number of blocks into the amount of sand, stone and cement. Work is organised in two levels: production areas, and projects inside them. This short tour shows where everything is.
tour.worker.title=What you see
tour.worker.text=As a worker you see the amounts of materials and the mix proportions for every project. Prices and costs are visible to managers only.
tour.areas.title=Production areas
tour.areas.text=This is the home of all your work. A production area is a site or workshop with its own prices and team.
tour.row.title=Open an area
tour.row.text=Click anywhere on a row to open the area and see its projects. Inside you can create a new project and share it with colleagues.
tour.new.title=Set up a new area
tour.new.text=Add a production area, choose its currency, enter material prices and assign the workers who may create projects there.
tour.settings.title=Settings
tour.settings.staff=Currencies and the wheelbarrow weight, the list of users and your own account (password) are all here.
tour.settings.worker=Your account and password are here.
tour.lang.title=Language
tour.lang.text=Switch the interface between English and Russian at any time.
tour.replay.title=Tour again
tour.replay.text=Press this button whenever you want to see the tour again. Question-mark icons next to labels explain every part of the page.
tour.flow.title=Your first project
tour.flow.text=1. Open a production area. 2. Press New project. 3. Enter full and half blocks and choose a mix. 4. Read the materials, then export a PDF or share the project.
