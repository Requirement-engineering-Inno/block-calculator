tour.replay.text=Нажмите эту кнопку, чтобы увидеть обзор ещё раз. Значки со знаком вопроса рядом с названиями объясняют каждую часть страницы.
tour.flow.title=Ваш первый проект
tour.flow.text=1. Откройте производственный участок. 2. Нажмите «Новый проект». 3. Введите целые и половинки блоков и выберите смесь. 4. Посмотрите материалы, затем выгрузите PDF или откройте проект коллегам.
