spring.application.name=block-calculator
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/blockcalc}
server.servlet.session.timeout=8h

# UI languages shown in the switcher. To add one: add messages_<code>.properties and list the code here.
app.languages=en,ru
app.admin.username=admin
app.admin.email=${ADMIN_EMAIL:admin@blockcalc.local}
app.admin.password=${ADMIN_PASSWORD:admin}

# messages.properties is English and is the fallback for languages without a file
spring.messages.fallback-to-system-locale=false

# Demo users and sample data (docker-compose turns this on). Never enable in production.
app.demo.enabled=false

# E-mail with the login and password of a new employee. Off by default; docker-compose turns it on with Mailpit.
# When enabled, set spring.mail.host (SPRING_MAIL_HOST) and spring.mail.port (SPRING_MAIL_PORT).
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@blockcalc.local}
app.public-url=${PUBLIC_URL:http://localhost:8080}
