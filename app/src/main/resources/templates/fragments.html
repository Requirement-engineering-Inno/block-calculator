<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183c33">
    <title th:text="#{app.title}">Block Calculator</title>
    <link rel="icon" th:href="@{/icon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

<!-- Icon sprite: <svg class="ic"><use href="#i-name"/></svg> -->
<svg th:fragment="icons" width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-calc" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.3c2 .7 3.5 2.6 3.5 5.7"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 8l4 4-4 4M20 12H9"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8M10 12h4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-block" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M6.3 6.3l11.4 11.4"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v6H7z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
</svg>

<aside th:fragment="sidebar(active)" class="sidebar">
    <a class="brand" th:href="@{/calculations}">
        <img th:src="@{/icon.svg}" alt="">
        <span><strong th:text="#{app.title}">Block Calculator</strong><small th:text="#{app.tagline}">Production planning</small></span>
    </a>
    <div class="nav-label" th:text="#{nav.workspace}">Workspace</div>
    <nav class="nav">
        <a th:href="@{/calculations}" th:classappend="${active == 'calcs'} ? 'active' : ''"><svg class="ic"><use href="#i-calc"/></svg><span th:text="#{nav.calculations}">Calculations</span></a>
        <a th:if="${me != null and me.staff}" th:href="@{/projects}" th:classappend="${active == 'projects'} ? 'active' : ''"><svg class="ic"><use href="#i-folder"/></svg><span th:text="#{nav.projects}">Projects</span></a>
        <a th:if="${me != null and me.staff}" th:href="@{/users}" th:classappend="${active == 'users'} ? 'active' : ''"><svg class="ic"><use href="#i-users"/></svg><span th:text="#{nav.users}">Users</span></a>
    </nav>
    <div class="sidebar-foot" th:if="${me != null}">
        <div class="lang">
            <a th:each="l : ${languages}" th:href="@{${currentPath}(lang=${l})}" th:text="${#strings.toUpperCase(l)}"
               th:classappend="${#locale.language == l} ? 'on' : ''">EN</a>
        </div>
        <a class="user-card" th:href="@{/account}" th:title="#{account.title}">
            <span class="avatar" th:text="${#strings.substring(me.displayName, 0, 1)}">A</span>
            <span><strong th:text="${me.displayName}">User</strong><small th:text="#{${'role.' + me.role}}">Role</small></span>
        </a>
        <form class="logout" th:action="@{/logout}" method="post">
            <button type="submit"><svg class="ic"><use href="#i-logout"/></svg><span th:text="#{nav.logout}">Log out</span></button>
        </form>
    </div>
</aside>

<header th:fragment="topbar(title)" class="topbar">
    <button type="button" class="menu-btn" id="menu-btn" aria-label="Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
    <span><span th:text="#{nav.workspace}">Workspace</span><span class="sep">/</span><strong th:text="${title}">Page</strong></span>
</header>

<footer th:fragment="foot" class="foot" th:text="#{app.footer}">Block Calculator</footer>

<div th:fragment="toast" th:if="${flash != null}" id="toast" role="status" class="toast">
    <svg class="ic"><use href="#i-check"/></svg><span th:text="#{${flash}}">Saved</span>
</div>
</body>
</html>
