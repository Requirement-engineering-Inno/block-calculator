<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head}"></head>
<body>
<div th:replace="~{fragments :: icons}"></div>
<aside th:replace="~{fragments :: sidebar('settings')}"></aside>
<div class="app-shell">
    <header th:replace="~{fragments :: topbar(#{nav.settings})}"></header>
    <main>
        <div class="page-head">
            <div>
                <div class="eyebrow" th:text="#{settings.eyebrow}">Application</div>
                <h1 th:text="#{settings.title}">Settings</h1>
                <p th:text="#{settings.subtitle}">Values shared by all projects.</p>
            </div>
        </div>

        <div class="grid-main">
            <section class="card" id="wheelbarrow-card">
                <div class="card-head"><h2 th:text="#{settings.wheelbarrow}">Wheelbarrow weight</h2><img class="mat-ico" th:src="@{/img/wheelbarrow.svg}" alt=""></div>
                <div class="card-body">
                    <p class="hint" style="margin:0 0 16px" th:text="#{settings.wheelbarrow.hint}">One wheelbarrow of sand or stone. Used when a calculation has no value of its own.</p>
                    <form th:action="@{/settings/wheelbarrow}" method="post">
                        <div class="field">
                            <label class="lbl" for="kg" th:text="#{settings.wheelbarrow.label}">Weight (WS)</label>
                            <div class="input-group">
                                <input id="kg" type="number" name="kg" min="1" max="10000" step="any" th:value="${wheelbarrow}" required>
                                <span class="suffix" th:text="#{unit.kg}">kg</span>
                            </div>
                        </div>
                        <button id="btn-save-wheelbarrow" type="submit" class="btn primary" th:text="#{common.save}">Save</button>
                    </form>
                </div>
            </section>

            <section class="card" id="currencies-card">
                <div class="card-head"><h2 th:text="#{settings.currencies}">Currencies</h2></div>
                <div class="card-body">
                    <p class="hint" style="margin:0 0 14px" th:text="#{settings.currencies.hint}">Projects choose their currency from this list.</p>
                    <ul id="currency-list" class="currency-list">
                        <li th:each="e : ${usage}" th:attr="data-currency=${e.key}">
                            <strong class="code" th:text="${e.key}">RUB</strong>
                            <span class="hint" style="margin:0" th:text="#{settings.currencies.usedBy(${e.value})}">2 projects</span>
                            <form class="inline" th:action="@{/settings/currencies/{code}/delete(code=${e.key})}" method="post">
                                <button type="submit" class="btn-icon" th:title="#{common.remove}" th:disabled="${e.value > 0}"><svg class="ic"><use href="#i-trash"/></svg></button>
                            </form>
                        </li>
                    </ul>
                    <form th:action="@{/settings/currencies}" method="post" class="currency-add">
                        <input type="text" name="code" required maxlength="3" minlength="3" pattern="[A-Za-z]{3}" th:placeholder="#{settings.currencies.placeholder}" autocomplete="off" th:aria-label="#{settings.currencies.placeholder}">
                        <button id="btn-add-currency" type="submit" class="btn primary" th:text="#{settings.currencies.add}">Add</button>
                    </form>
                </div>
            </section>
        </div>
    </main>
    <footer th:replace="~{fragments :: foot}"></footer>
</div>
<div th:replace="~{fragments :: toast}"></div>
</body>
</html>
