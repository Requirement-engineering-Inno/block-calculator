<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head}"></head>
<body>
<div th:replace="~{fragments :: icons}"></div>
<th:block th:if="${me != null}"><aside th:replace="~{fragments :: sidebar('')}"></aside></th:block>
<div class="app-shell" th:style="${me == null} ? 'margin-left:0' : ''">
    <header th:replace="~{fragments :: topbar(#{error.title})}"></header>
    <main>
        <div class="err-page card card-body">
            <img class="empty-art" th:src="@{/img/block.svg}" alt="">
            <div class="code" th:text="${status != null} ? ${status} : '!'">!</div>
            <h2 th:text="#{error.title}">Error</h2>
            <p id="error-message" th:text="${errorMessage != null ? errorMessage : (status == 403 ? #messages.msg('error.403') : (status == 404 ? #messages.msg('error.404') : #messages.msg('error.generic')))}">Something went wrong</p>
            <div class="page-actions" style="justify-content:center">
                <a class="btn secondary" href="javascript:history.back()"><svg class="ic"><use href="#i-back"/></svg><span th:text="#{common.back}">Back</span></a>
                <a class="btn primary" th:href="@{/projects}"><span th:text="#{error.home}">Go to production areas</span></a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
