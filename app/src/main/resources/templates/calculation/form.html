<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head}"></head>
<body>
<div th:replace="~{fragments :: icons}"></div>
<aside th:replace="~{fragments :: sidebar('calcs')}"></aside>
<div class="app-shell">
    <header th:replace="~{fragments :: topbar(${editing} ? #{calc.edit} : #{calc.new})}"></header>
    <main>
        <div class="page-head">
            <div>
                <div class="eyebrow" th:text="${projectSystem} ? #{project.system} : ${projectName}">Project</div>
                <h1 th:text="${editing} ? #{calc.edit} : #{calc.new}">New calculation</h1>
                <p th:text="#{calc.form.subtitle}">Enter the blocks and the mix. The estimate updates as you type.</p>
            </div>
        </div>

        <form th:action="${editing} ? @{/calculations/{id}(id=${f.id()})} : @{/calculations}" method="post">
            <div class="grid-main">
                <section class="card">
                    <div class="card-head"><h2 th:text="#{calc.section.details}">Production details</h2><span class="step" th:text="#{calc.step.input}">1 / Input</span></div>
                    <div class="card-body">
                        <div class="field" th:unless="${editing}">
                            <label class="lbl" for="projectId" th:text="#{calc.project}">Project</label>
                            <select id="projectId" name="projectId">
                                <option th:each="p : ${projects}" th:value="${p.id}" th:selected="${p.id == f.projectId()}"
                                        th:text="${p.system} ? #{project.system} : ${p.name}">Project</option>
                            </select>
                        </div>
                        <input type="hidden" name="projectId" th:if="${editing}" th:value="${f.projectId()}">

                        <div class="field">
                            <label class="lbl" for="title"><span th:text="#{calc.title}">Title</span> <span class="opt" th:text="#{common.optional}">(optional)</span></label>
                            <input id="title" type="text" name="title" maxlength="100" th:value="${f.title()}" th:placeholder="#{calc.title.placeholder}">
                        </div>

                        <div class="row2">
                            <div class="field">
                                <label class="lbl" for="fullBlocks" th:text="#{calc.fullBlocks}">Full blocks</label>
                                <input id="fullBlocks" type="number" name="fullBlocks" min="0" max="10000000" step="1" inputmode="numeric" th:value="${f.fullBlocks()}" placeholder="0">
                            </div>
                            <div class="field">
                                <label class="lbl" for="halfBlocks" th:text="#{calc.halfBlocks}">Half blocks</label>
                                <input id="halfBlocks" type="number" name="halfBlocks" min="0" max="10000000" step="1" inputmode="numeric" th:value="${f.halfBlocks()}" placeholder="0">
                            </div>
                        </div>

                        <div class="section-title" th:text="#{calc.section.mix}">Mix</div>
                        <fieldset>
                            <legend class="sr-only" th:text="#{calc.batch}">Batch</legend>
                            <div class="batch-options">
                                <label class="batch-option" th:each="m : ${mixes}">
                                    <input type="radio" name="batch" th:value="${m.number}" th:checked="${m.number == f.batch()}">
                                    <strong th:text="#{calc.batch.short(${m.number})}">Batch 4</strong>
                                    <span th:text="#{calc.mpa(${m.mpa})}">7.6 MPa</span>
                                </label>
                            </div>
                            <p class="mix-hint" th:each="m : ${mixes}" th:attr="data-mix=${m.number}" th:hidden="${m.number != f.batch()}"
                               th:text="#{calc.mix.hint(${m.sandBarrows}, ${m.stoneBarrows}, ${m.yield})}">Recipe</p>
                        </fieldset>

                        <div class="section-title" th:text="#{calc.section.options}">Options</div>
                        <div class="field">
                            <label class="lbl" for="ws" th:text="#{calc.ws}">Wheelbarrow weight</label>
                            <div class="input-group">
                                <input id="ws" type="number" name="ws" min="1" max="10000" step="any" th:value="${f.ws()}" th:placeholder="${wsHint}">
                                <span class="suffix" th:text="#{unit.kg}">kg</span>
                            </div>
                            <p class="hint" th:text="#{calc.ws.hint(${wsHint})}">Leave empty to use the project default.</p>
                        </div>
                        <label class="switch">
                            <input type="checkbox" name="roundUp" th:checked="${f.roundUp()}">
                            <span class="track"></span>
                            <span><strong th:text="#{calc.roundUp}">Round batches up</strong><small th:text="#{calc.roundUp.hint}">Plan whole batches only.</small></span>
                        </label>

                        <div class="form-actions">
                            <a class="btn ghost" th:href="${editing} ? @{/calculations/{id}(id=${f.id()})} : @{/calculations}" th:text="#{common.cancel}">Cancel</a>
                            <button id="btn-save" type="submit" class="btn primary"><span th:text="#{calc.save}">Save calculation</span><svg class="ic"><use href="#i-check"/></svg></button>
                        </div>
                    </div>
                </section>

                <div>
                    <!-- htmx: every change in the form is posted to /calculations/preview and the estimate is swapped in -->
                    <div id="preview" th:attr="hx-post=@{/calculations/preview}" hx-trigger="load, input delay:250ms, change" hx-target="this" hx-swap="innerHTML"
                         hx-include="closest form"></div>
                </div>
            </div>
        </form>
    </main>
    <footer th:replace="~{fragments :: foot}"></footer>
</div>
<div th:replace="~{fragments :: toast}"></div>
</body>
</html>
