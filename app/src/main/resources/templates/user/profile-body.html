<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Profile cards shared by "my account" and the employee profile. Needs model attribute "p". -->
<div th:fragment="body" class="stack">
    <section class="card">
        <div class="card-body profile-head">
            <span class="avatar xl" th:text="${#strings.substring(p.displayName(), 0, 1)}">A</span>
            <div class="profile-main">
                <h2 id="profile-name" th:text="${p.displayName()}">Name</h2>
                <div class="profile-chips">
                    <span id="profile-role" class="chip" th:classappend="${p.role().name() == 'MANAGER'} ? 'blue' : (${p.role().name() == 'ADMIN'} ? 'amber' : 'green')" th:text="#{${'role.' + p.role()}}">Role</span>
                    <span id="profile-status" class="chip" th:classappend="${p.active()} ? 'green' : 'gray'" th:text="${p.active()} ? #{user.active} : #{user.blocked}">Active</span>
                </div>
            </div>
        </div>
        <div class="card-body" style="padding-top:0">
            <dl class="kv">
                <dt th:text="#{user.username}">Username</dt><dd id="profile-username" th:text="${p.username()}">login</dd>
                <dt th:text="#{profile.since}">Account created</dt>
                <dd><time id="profile-created" th:if="${p.createdAt() != null}" th:datetime="${p.createdAt()}" th:text="${@times.gmt(p.createdAt())}">2026-11-17 10:00 GMT</time><span th:if="${p.createdAt() == null}">—</span></dd>
                <dt th:text="#{profile.createdBy}">Created by</dt><dd th:text="${p.createdBy() != null} ? ${p.createdBy()} : '—'">Admin</dd>
            </dl>
        </div>
    </section>

    <div class="stats stats-3">
        <div class="stat"><span th:text="#{profile.authored}">Calculations</span><strong id="profile-authored" th:text="${p.authored()}">0</strong></div>
        <div class="stat"><span th:text="#{calc.stat.frozen}">Frozen</span><strong th:text="${p.frozen()}">0</strong></div>
        <div class="stat"><span th:text="#{calc.stat.archived}">Archived</span><strong th:text="${p.archived()}">0</strong></div>
    </div>

    <section class="card">
        <div class="card-head"><h2 th:text="${p.role().name() == 'WORKER'} ? #{profile.projects.worker} : #{profile.projects.staff}">Projects</h2></div>
        <div class="card-body">
            <p class="hint" th:if="${p.projects().isEmpty()}" th:text="#{profile.projects.none}">No projects.</p>
            <div class="chip-row">
                <span th:each="pr : ${p.projects()}" th:attr="data-profile-project=${pr.name()}">
                    <a class="chip green" th:if="${me.staff}" th:href="@{/projects/{id}(id=${pr.id()})}" th:text="${pr.system()} ? #{project.system} : ${pr.name()}">Project</a>
                    <span class="chip green" th:unless="${me.staff}" th:text="${pr.system()} ? #{project.system} : ${pr.name()}">Project</span>
                </span>
            </div>
        </div>
    </section>

    <section class="card">
        <div class="card-head"><h2 th:text="#{profile.recent}">Recent calculations</h2></div>
        <div class="card-body table-wrap">
            <p class="hint" th:if="${p.recent().isEmpty()}" th:text="#{profile.recent.none}">No calculations yet.</p>
            <table th:if="${!p.recent().isEmpty()}">
                <tbody>
                <tr th:each="c : ${p.recent()}" th:attr="data-profile-calc=${c.title()}" th:classappend="${c.archived()} ? 'archived' : ''">
                    <td class="cell-title"><a th:href="@{/calculations/{id}(id=${c.id()})}" th:text="${c.title()}">Walls</a>
                        <small th:text="${c.projectSystem()} ? #{project.system} : ${c.project()}">Project</small></td>
                    <td class="num"><time th:datetime="${c.updatedAt()}" th:text="${@times.gmt(c.updatedAt())}">2026-11-17 10:00 GMT</time></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
</body>
</html>
