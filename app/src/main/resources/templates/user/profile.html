<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head}"></head>
<body>
<div th:replace="~{fragments :: icons}"></div>
<aside th:replace="~{fragments :: sidebar('users')}"></aside>
<div class="app-shell">
    <header th:replace="~{fragments :: topbar(${p.displayName()})}"></header>
    <main>
        <div class="page-head">
            <div>
                <div class="eyebrow"><a th:href="@{/users}" th:text="#{user.back}">All users</a></div>
                <h1 th:text="#{profile.title}">Employee profile</h1>
            </div>
            <div class="page-actions">
                <a class="btn ghost" th:href="@{/users}"><svg class="ic"><use href="#i-back"/></svg><span th:text="#{common.back}">Back</span></a>
                <form class="inline" th:if="${p.role().name() != 'ADMIN' and p.active() and !p.self()}" th:action="@{/users/{id}/block(id=${p.id()})}" method="post">
                    <button type="submit" class="btn secondary"><svg class="ic"><use href="#i-block"/></svg><span th:text="#{user.block}">Block</span></button>
                </form>
                <form class="inline" th:if="${p.role().name() != 'ADMIN' and !p.active()}" th:action="@{/users/{id}/unblock(id=${p.id()})}" method="post">
                    <button type="submit" class="btn secondary"><svg class="ic"><use href="#i-restore"/></svg><span th:text="#{user.unblock}">Unblock</span></button>
                </form>
            </div>
        </div>
        <div style="max-width:820px"><div th:replace="~{user/profile-body :: body}"></div></div>
    </main>
    <footer th:replace="~{fragments :: foot}"></footer>
</div>
<div th:replace="~{fragments :: toast}"></div>
</body>
</html>
